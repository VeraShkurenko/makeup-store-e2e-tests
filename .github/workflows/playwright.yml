name: E2E tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  e2e:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome]

    steps:
      - name: Checkout tests
        uses: actions/checkout@v4

      - name: Checkout app under test (Make-Up Clone)
        uses: actions/checkout@v4
        with:
          repository: ShVira/MakeUpClone
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix app

      - name: Install Playwright browser
        run: |
          BROWSER=${{ matrix.project == 'mobile-chrome' && 'chromium' || matrix.project }}
          npx playwright install --with-deps $BROWSER

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
